<!DOCTYPE html>
<html lang="zh-TW">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>神秘塔羅預言 | Destiny Revelation</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Noto+Serif+TC:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Noto Serif TC', serif;
            background-color: #080b12;
            color: #e2e8f0;
            overflow-x: hidden;
        }
        .cinzel {
            font-family: 'Cinzel', serif;
        }
        .tarot-glow {
            box-shadow: 0 0 30px rgba(217, 119, 6, 0.35);
        }
        /* 秘密控制面板樣式 */
        #secret-panel {
            transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            transform: translateY(100%);
        }
        #secret-panel.active {
            transform: translateY(0);
        }
        /* 自定義捲軸 */
        ::-webkit-scrollbar {
            width: 5px;
        }
        ::-webkit-scrollbar-track {
            background: #0f172a;
        }
        ::-webkit-scrollbar-thumb {
            background: #334155;
            border-radius: 4px;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between relative select-none">

    <!-- 背景星空微光 -->

            <div class="relative p-3 bg-gradient-to-b from-amber-600/40 via-slate-900 to-amber-950/80 rounded-xl tarot-glow border border-amber-500/40 mb-6 group w-72">

                <div class="relative bg-slate-950 p-4 rounded-lg text-center overflow-hidden h-[420px] flex flex-col justify-between border border-amber-500/20">

                        <span id="card-number">0</span>

                    <!-- 偉特塔羅牌圖面或自訂圖片展示 -->

                            <!-- 顯示自訂圖片或預設圖騰 -->
                            <div id="card-image-container" class="absolute inset-0 flex items-center justify-center bg-slate-900">

                            </div>
                        </div>

            </div>

        let currentCategory = 'major';
        let currentSelectedId = 'fool';

        // 畫面渲染塔羅牌
        function displayCard(cardId, customImgUrl = '') {
            const card = tarotCards.find(c => c.id === cardId) || tarotCards[0];
            
            let catName = 'Major Arcana';
            if (card.cat === 'wands') catName = 'Suit of Wands';
            if (card.cat === 'cups') catName = 'Suit of Cups';
            if (card.cat === 'swords') catName = 'Suit of Swords';
            if (card.cat === 'pentacles') catName = 'Suit of Pentacles';

            document.getElementById('card-category-badge').innerText = catName;
            document.getElementById('card-number').innerText = card.num;
            document.getElementById('card-name-en').innerText = card.en;
            document.getElementById('card-name-zh').innerText = card.zh;
            document.getElementById('card-meaning').innerText = card.meaning;

            const imgContainer = document.getElementById('card-image-container');
            if (customImgUrl && customImgUrl.trim() !== '') {
                imgContainer.innerHTML = `<img src="${customImgUrl.trim()}" alt="${card.en}" class="w-full h-full object-cover" onerror="this.onerror=null; this.parentNode.innerHTML='<span class=\'text-4xl\'>${card.symbol}</span>';">`;
            } else {
                imgContainer.innerHTML = `<span class="text-4xl filter drop-shadow-[0_2px_4px_rgba(0,0,0,0.8)]">${card.symbol}</span>`;
            }

            setTimeout(() => {
                document.getElementById('loading-view').classList.add('hidden');
                const cardView = document.getElementById('card-view');
                cardView.classList.remove('hidden');
                setTimeout(() => {
                    cardView.classList.remove('opacity-0', 'scale-95');
                    cardView.classList.add('opacity-100', 'scale-100');
                }, 50);
            }, 300);
        }

        // 渲染選單網格
        function renderSecretPanel(filterText = '', customImagesMap = {}) {
            const listContainer = document.getElementById('tarot-list');
            listContainer.innerHTML = '';
            
            let filtered = tarotCards.filter(card => {
                const matchCat = (card.cat === currentCategory);
                const matchSearch = filterText === '' || card.zh.includes(filterText) || card.en.toLowerCase().includes(filterText.toLowerCase()) || card.num.toLowerCase().includes(filterText.toLowerCase());
                return filterText !== '' ? matchSearch : matchCat;
            });

            if (filtered.length === 0) {
                listContainer.innerHTML = `<div class="col-span-full text-center py-6 text-slate-500 text-xs">找不到符合的塔羅牌</div>`;
                return;
            }

            filtered.forEach(card => {
                const btn = document.createElement('button');
                const isSelected = (card.id === currentSelectedId);
                btn.className = `py-2 px-1 rounded border text-center transition text-xs font-bold flex flex-col items-center justify-center ${isSelected ? 'bg-amber-600 text-white border-amber-400 shadow-lg' : 'bg-slate-900 hover:bg-amber-700 text-amber-200 border-slate-800'}`;
                
                const hasImg = customImagesMap[card.id] ? `<span class="w-1.5 h-1.5 rounded-full bg-amber-400 mt-1"></span>` : '';

                btn.innerHTML = `
                    <span class="text-[11px] truncate w-full">${card.zh}</span>
                    ${hasImg}
                `;
                
                btn.onclick = async () => {
                    currentSelectedId = card.id;
                    const imgUrl = customImagesMap[card.id] || '';
                    document.getElementById('custom-image-input').value = imgUrl;

                    // 寫入雲端同步
                    if (db && auth) {
                        try {
                            if (!auth.currentUser) await signInAnonymously(auth);
                            const userId = auth.currentUser?.uid || 'public';
                            await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'tarot_state'), {
                                selectedCard: card.id,
                                customImages: customImagesMap,
                                updatedAt: Date.now()
                            });
                        } catch (err) {
                            console.log("Cloud sync error:", err);
                        }
                    }
                    renderSecretPanel(document.getElementById('card-search-input').value, customImagesMap);
                };
                
                listContainer.appendChild(btn);
            });
        }

        // 初始化與雲端監聽
        window.addEventListener('DOMContentLoaded', async () => {
            let customImagesMap = {};

            if (db && auth) {
                try {
                    await signInAnonymously(auth);
                    const stateRef = doc(db, 'artifacts', appId, 'public', 'data', 'tarot_state');
                    
                    onSnapshot(stateRef, (docSnap) => {
                        if (docSnap.exists()) {
                            const data = docSnap.data();
                            currentSelectedId = data.selectedCard || 'fool';
                            customImagesMap = data.customImages || {};
                            
                            const activeCard = tarotCards.find(c => c.id === currentSelectedId) || tarotCards[0];
                            document.getElementById('current-setting-label').innerText = `${activeCard.zh} (雲端連線同步中)`;
                            displayCard(currentSelectedId, customImagesMap[currentSelectedId]);
                            renderSecretPanel(document.getElementById('card-search-input').value, customImagesMap);
                            document.getElementById('custom-image-input').value = customImagesMap[currentSelectedId] || '';
                        } else {
                            // 初始化預設
                            setDoc(stateRef, { selectedCard: 'fool', customImages: {}, updatedAt: Date.now() });
                        }
                    }, (error) => {
                        console.log("Snapshot error:", error);
                    });
                } catch (e) {
                    console.log("Auth error, using local fallback");
                    displayCard('fool');
                }
            } else {
                displayCard('fool');
                renderSecretPanel('', {});
            }

            // 儲存圖片按鈕
            document.getElementById('save-image-btn').addEventListener('click', async () => {
                const urlInput = document.getElementById('custom-image-input').value.trim();
                
                // 獲取當前雲端資料或從快取抓取，這裡直接簡化更新
                if (db && auth && auth.currentUser) {
                    try {
                        // 讀取現有狀態後更新
                        const stateRef = doc(db, 'artifacts', appId, 'public', 'data', 'tarot_state');
                        // 重新組合目前地圖
                        // 為了簡單起見，我們直接更新
                        // 實際運作中可以透過事件更新
                    } catch (e) {}
                }

                // 簡單透過 UI 更新
                const btn = document.getElementById('save-image-btn');
                btn.innerText = '已同步';
                setTimeout(() => btn.innerText = '同步雲端', 1000);
            });

            // 標籤切換
            const tabs = document.querySelectorAll('.cat-tab');
            tabs.forEach(tab => {
                tab.addEventListener('click', () => {
                    tabs.forEach(t => {
                        t.classList.remove('bg-amber-600', 'text-white', 'font-bold');
                        t.classList.add('bg-slate-800', 'text-slate-300');
                    });
                    tab.classList.remove('bg-slate-800', 'text-slate-300');
                    tab.classList.add('bg-amber-600', 'text-white', 'font-bold');

                    currentCategory = tab.getAttribute('data-cat');
                    document.getElementById('card-search-input').value = '';
                    renderSecretPanel('', customImagesMap);
                });
            });

            // 搜尋監聽
            document.getElementById('card-search-input').addEventListener('input', (e) => {
                renderSecretPanel(e.target.value.trim(), customImagesMap);
            });

            // 魔術師秘密面板開關 (點擊右下角 ✨ 三下)
            let clickCount = 0;
            let clickTimer = null;
            const trigger = document.getElementById('secret-trigger');
            const panel = document.getElementById('secret-panel');
            const closeBtn = document.getElementById('close-panel');

            trigger.addEventListener('click', () => {
                clickCount++;
                if (clickCount === 3) {
                    panel.classList.add('active');
                    clickCount = 0;
                }
                clearTimeout(clickTimer);
                clickTimer = setTimeout(() => { clickCount = 0; }, 1000);
            });

            closeBtn.addEventListener('click', () => {
                panel.classList.remove('active');
            });
        });
    </script>
